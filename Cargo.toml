[workspace]
resolver = "3"
members = ["crates/core", "crates/audio", "crates/app"]
exclude = ["crates/setup"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
