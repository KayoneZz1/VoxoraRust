[package]
name = "voxora-setup"
version = "1.0.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "Voxora Rust setup executable"

[[bin]]
name = "voxora-setup"
path = "src/main.rs"

[dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }
winreg = "0.55"
base64 = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
