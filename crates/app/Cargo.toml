[package]
name = "voxora-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Voxora console UI (egui)"

[[bin]]
name = "voxora"
path = "src/main.rs"

[dependencies]
voxora-core = { path = "../core" }
voxora-audio = { path = "../audio" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "links", "system_fonts"] }
egui = "0.37"
rfd = { version = "0.17", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "2.12"
zip = "2.4"
serde_json.workspace = true
serde.workspace = true
anyhow.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_Graphics_GdiPlus", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Media_Audio", "Win32_UI_Shell"] }
winreg = "0.55"
