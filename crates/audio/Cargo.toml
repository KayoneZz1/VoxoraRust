[package]
name = "voxora-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Voxora audio engine (cpal + symphonia)"

[dependencies]
voxora-core = { path = "../core" }
cpal = "0.15.3"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac", "aac", "isomp4"] }
rtrb = "0.3"
crossbeam-channel = "0.5"
anyhow.workspace = true
